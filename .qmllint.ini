# Quickshell isn't an official Arch package (AUR/build-from-source), so CI's
# qmllint runs without it on the import path — every Quickshell/`qs.*` type
# (Singleton, Process, FileView, the qs.config/services/ui namespace imports)
# is unresolvable there. That cascades into the categories below on nearly
# every file. They're expected noise from CI's minimal environment, not real
# defects, so they're demoted to `info` (still visible, never fails the
# build). `signal-handler-parameters` is included too: it fires even with
# Quickshell resolvable, on a QProcess::ExitStatus builtin gap unrelated to
# this codebase. Everything else — including any genuine `Error:` — still
# fails the job.
[General]
[Warnings]
import=info
unqualified=info
missing-property=info
unresolved-type=info
prefer-non-var-properties=info
signal-handler-parameters=info
