name: PKGBUILD check

on:
  push:
    paths:
      - packaging/PKGBUILD
  pull_request:
    paths:
      - packaging/PKGBUILD

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install namcap
        run: pacman -Syu --noconfirm git namcap

      - name: makepkg refuses to run as root — build as a throwaway user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Validate PKGBUILD syntax (no network — doesn't fetch `source`)
        run: su builder -c 'cd packaging && makepkg --printsrcinfo' > /dev/null

      - name: namcap PKGBUILD
        run: |
          su builder -c 'cd packaging && namcap PKGBUILD' | tee /tmp/namcap.out
          test ! -s /tmp/namcap.out
