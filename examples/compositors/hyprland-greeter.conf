# Hyprland config for hosting quickgreet under greetd.
#
#   /etc/greetd/config.toml:
#     command = "Hyprland -c /etc/greetd/hyprland-greeter.conf"
#     user = "greeter"
#
# Worth preferring if you already run Hyprland: the greeter then uses the same
# monitor semantics as your real session, so a dual-monitor layout doesn't have
# to be re-expressed in a second compositor's syntax and drift from the one
# that works.

# Outputs. Copy these from your session's own config — `hyprctl monitors`
# prints exactly what you need.
#   monitor = NAME, RESOLUTION@RATE, POSITION, SCALE
monitor = , preferred, auto, 1
# Example, dual 4K side by side:
# monitor = DP-3, 3840x2160@60, 0x0, 1
# monitor = DP-2, 3840x2160@60, 3840x0, 1

# The greeter is the only client; when it exits, so does the compositor.
exec-once = qs -p /usr/share/quickgreet/greeter.qml; hyprctl dispatch exit

# No decorations, no animations to wait through, nothing to alt-tab to.
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x000000
}

input {
    # Match your session's layout, or you'll be typing your password on the
    # wrong keymap — a genuinely confusing way to be locked out.
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
}

# An escape hatch: if the greeter ever fails to draw, this still gets you out.
bind = CTRL ALT, Delete, exit
